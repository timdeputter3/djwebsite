<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bassly{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}Bassly maakt DJ boeken in Kortrijk en omgeving overzichtelijk, professioneel en snel.{% endblock %}">
    <meta property="og:title" content="{% block og_title %}{{ self.title() }}{% endblock %}">
    <meta property="og:description" content="{% block og_description %}{{ self.meta_description() }}{% endblock %}">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="site-shell">
        <header class="site-header">
            <a class="brand" href="{{ url_for('home') }}">
                <span class="brand-mark">B</span>
                <span class="brand-copy">
                    <strong>Bassly</strong>
                    <small>DJ bookings in en rond Kortrijk</small>
                </span>
            </a>
            <nav class="site-nav">
                <a class="{% if request.endpoint == 'home' %}is-current{% endif %}" href="{{ url_for('home') }}">Home</a>
                <a class="{% if request.endpoint == 'agenda' %}is-current{% endif %}" href="{{ url_for('agenda') }}">Agenda</a>
                <a class="{% if request.endpoint in ['djs', 'dj_detail'] %}is-current{% endif %}" href="{{ url_for('djs') }}">DJ's</a>
                <a class="{% if request.endpoint == 'join' %}is-current{% endif %}" href="{{ url_for('join') }}">DJ aanmelden</a>
                <a class="{% if request.endpoint == 'book' %}is-current{% endif %}" href="{{ url_for('book') }}">Boeken</a>
                <a class="{% if request.endpoint == 'contact' %}is-current{% endif %}" href="{{ url_for('contact') }}">Contact</a>
                {% if manager_logged_in %}
                <a class="{% if request.endpoint == 'manager' %}is-current{% endif %}" href="{{ url_for('manager') }}">Manager</a>
                <a href="{{ url_for('manager_logout') }}">Logout</a>
                {% else %}
                <a class="nav-utility {% if request.endpoint == 'manager_login' %}is-current{% endif %}" href="{{ url_for('manager_login') }}">Manager login</a>
                {% endif %}
            </nav>
        </header>
        {% block content %}{% endblock %}
    </div>
</body>
</html>
