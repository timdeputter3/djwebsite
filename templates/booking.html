<!DOCTYPE html>
<html>
<head>
    <title>Boek een DJ</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>Boek een DJ</h1>

    <form method="POST">
        <label>Naam:</label><br>
        <input type="text" name="name" required><br><br>

        <label>Email:</label><br>
        <input type="email" name="email" required><br><br>

        <label>Kies DJ:</label><br>
        <select name="dj">
            <option>DJ Vet & Vriend</option>
            <option>DJ Vicle</option>
        </select><br><br>

        <button type="submit">Boek nu</button>
    </form>

    <a href="/">Home</a>
</body>
</html>
