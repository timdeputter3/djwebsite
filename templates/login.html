{% extends "base.html" %}
{% block title %}Bassly | Login{% endblock %}
{% block content %}
<main class="page-stack">
    <section class="login-shell">
        <div class="page-hero compact-hero">
            <p class="eyebrow">Login</p>
            <h1>Log in op je Bassly-account.</h1>
            <p class="lead">
                Gebruik je gebruikersnaam of e-mailadres om toegang te krijgen tot je account en vervolgstappen.
            </p>
        </div>

        <form class="booking-form login-form" method="POST">
            {% if error %}
            <div class="notice error-notice">
                <strong>Login mislukt.</strong>
                <span>{{ error }}</span>
            </div>
            {% endif %}
            <input type="hidden" name="next" value="{{ next_url }}">
            <label>
                Gebruikersnaam of e-mail
                <input type="text" name="identifier" required>
            </label>
            <label>
                Wachtwoord
                <input type="password" name="password" required>
            </label>
            <button class="button button-gold" type="submit">Inloggen</button>
        </form>
    </section>
</main>
{% endblock %}
