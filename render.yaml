services:
  - type: web
    name: bassly
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: MANAGER_USERNAME
        value: managertim
      - key: MANAGER_PASSWORD
        sync: false
      - key: MANAGER_EMAIL
        value: manager@bassly.local
      - key: UPLOAD_BACKEND
        value: local
