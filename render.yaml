databases:
  - name: bassly-db
    plan: free

services:
  - type: web
    name: bassly
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bassly-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: MANAGER_PASSWORD
        sync: false
